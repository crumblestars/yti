<style>


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --navy: #03040a; --electric: #dce4f3; --white: #f6f7fb; --accent: #b6bfce; }

html { scroll-behavior: smooth; }
body {
  font-family: 'Montserrat', system-ui, sans-serif;
  background: var(--navy);
  color: var(--white);
  overflow-x: hidden;
  cursor: none;
}


#bg-matrix-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#bg-spotlight     { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: rgba(3,4,10,0.93); }
#bg-plexus        { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
#bg-scanlines     { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px); }
#bg-vignette      { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(3,4,10,.55) 100%); }


#cursor     { position: fixed; pointer-events: none; z-index: 9999; mix-blend-mode: screen; }
#cursor-dot { width:6px; height:6px; background:var(--electric); border-radius:50%; position:absolute; transform:translate(-50%,-50%); box-shadow:0 0 8px var(--electric),0 0 20px var(--electric); }
#cursor-ring{ width:38px; height:38px; border:1px solid rgba(210,225,255,.35); border-radius:50%; position:absolute; transform:translate(-50%,-50%); }


#navbar {
  position:fixed; inset:0 0 auto 0; z-index:1000; padding:20px 40px;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}
#navbar.nav-hidden { transform:translateY(-100%); }
#navbar nav { display:flex; align-items:center; max-width:1200px; margin:0 auto; }
.nav-pill {
  display:flex; align-items:center; height:48px; padding:0 24px;
  border-radius:999px; background:rgba(14,14,23,0.8); border:1px solid rgba(210,225,255,0.2);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  text-decoration:none; transition:border-color .2s;
}
.nav-pill:hover { border-color:rgba(210,225,255,0.4); }
.nav-line { flex:1; height:1px; background:linear-gradient(90deg, rgba(210,225,255,0.3), rgba(210,225,255,0.1), rgba(210,225,255,0.3)); margin:0 8px; }
#navbar .logo { font-family:'DM Serif Display',serif; font-size:20px; letter-spacing:1px; color:var(--white); }
#navbar .logo span { font-style:italic; color:var(--electric); text-shadow:0 0 20px rgba(210,225,255,0.4); }
#navbar .logo-img { height:32px; width:auto; display:block; filter:drop-shadow(0 0 20px rgba(210,225,255,0.4)); }
.nav-links { gap:28px; }
.nav-links a { color:rgba(245,247,250,0.75); text-decoration:none; font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; transition:color .2s; white-space:nowrap; }
.nav-links a:hover { color:var(--electric); }


.lang-switcher { position:relative; font-family:'Montserrat',sans-serif; }
.lang-trigger {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(14,14,23,0.8); border:1px solid rgba(210,225,255,0.2);
  color:var(--white); padding:0 20px; height:48px; border-radius:999px;
  font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase;
  cursor:pointer; transition:border-color .2s;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  font-family:inherit;
}
.lang-trigger:hover { border-color:rgba(210,225,255,0.4); }
.lang-trigger .caret { transition:transform .25s ease; display:inline-block; font-size:10px; opacity:.7; }
.lang-trigger[aria-expanded="true"] .caret { transform:rotate(180deg); }
.lang-menu {
  position:absolute; top:calc(100% + 10px); right:0; min-width:180px;
  background:rgba(14,14,23,0.92); border:1px solid rgba(210,225,255,0.18);
  border-radius:14px; padding:8px; list-style:none;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 12px 40px rgba(0,0,0,0.55), 0 0 24px rgba(210,225,255,0.08);
  opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none;
  transition:opacity .18s ease, transform .22s cubic-bezier(.2,.9,.3,1.4);
  z-index:1001;
}
.lang-switcher.open .lang-menu { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.lang-menu li { margin:0; }
.lang-menu button {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; background:none; border:none; padding:10px 14px; border-radius:10px;
  color:rgba(245,247,250,0.78); font-family:inherit; font-size:13px; font-weight:500;
  cursor:pointer; text-align:left; transition:background .15s, color .15s;
}
.lang-menu button:hover { background:rgba(210,225,255,0.08); color:var(--white); }
.lang-menu button.active { color:var(--electric); }
.lang-menu button .check { opacity:0; font-size:12px; color:var(--electric); }
.lang-menu button.active .check { opacity:1; }


section { position:relative; z-index:10; background:transparent; }
.section-inner { max-width:1140px; margin:0 auto; padding:110px 32px; }
.section-label { font-size:11px; letter-spacing:3.5px; text-transform:uppercase; color:var(--electric); margin-bottom:14px; }
.section-title { font-family:'DM Serif Display',serif; font-size:clamp(28px,4vw,46px); line-height:1.18; color:var(--white); margin-bottom:56px; }


#hero { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding-top:80px; }
.hero-content { max-width:860px; padding:0 24px; animation:heroFadeIn 1.2s ease forwards; }
@keyframes heroFadeIn { from{opacity:0;transform:translateY(32px)} to{opacity:1;transform:translateY(0)} }
.hero-tag { display:inline-block; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--electric); border:1px solid rgba(210,225,255,0.3); padding:6px 18px; border-radius:30px; margin-bottom:28px; background:rgba(210,225,255,0.05); backdrop-filter:blur(4px); }
.hero-title { font-family:'DM Serif Display',serif; font-size:clamp(36px,6vw,72px); line-height:1.12; color:var(--white); margin-bottom:22px; text-shadow:0 2px 40px rgba(0,0,0,0.5); }
.hero-title em { font-style:italic; color:var(--electric); text-shadow:0 0 30px rgba(210,225,255,0.4); }
.hero-subtitle { font-size:clamp(14px,1.8vw,18px); color:rgba(245,247,250,0.72); line-height:1.7; max-width:620px; margin:0 auto 44px; }
.hero-scroll { display:flex; align-items:center; gap:10px; justify-content:center; color:rgba(245,247,250,0.4); font-size:12px; letter-spacing:2px; text-transform:uppercase; animation:bounce 2s infinite; }
.hero-scroll svg { width:20px; height:20px; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }


.divider { height:1px; background:linear-gradient(90deg,transparent,rgba(210,225,255,0.15),transparent); }



.mockup-pc-screen video.mk-video,
.mockup-phone-screen video.mk-video { width:100%; height:100%; object-fit:cover; object-position:top; display:block; background:#000; opacity:0; transition:opacity .5s ease; }
.mockup-pc-screen video.mk-video.ready,
.mockup-phone-screen video.mk-video.ready { opacity:1; }
.scroll-frame { position:absolute; inset:0; overflow:hidden; background:#fff; border-radius:inherit; }
.mockup-pc-screen .scroll-frame, .mockup-phone-screen .scroll-frame { position:relative; width:100%; height:100%; }
.scroll-img { display:block; width:100%; height:auto; transform:translate3d(0,0,0); will-change:transform; }
@keyframes wsPortfolioScroll {
  0%   { transform: translate3d(0, 0, 0); }
  2.5% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(0, var(--scroll-max, 0px), 0); }
}
.scroll-img.play { animation: wsPortfolioScroll 40s cubic-bezier(0.42, 0, 0.58, 1) infinite; }
.scroll-img.paused { animation-play-state: paused; }


.portfolio-row { display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center; margin-bottom:140px; }
.portfolio-row.reverse .portfolio-text { order:2; }
.portfolio-row.reverse .portfolio-mockup { order:1; }
.portfolio-text .section-label { margin-bottom:14px; }
.portfolio-text .portfolio-title { font-family:'DM Serif Display',serif; font-size:clamp(28px,3.4vw,42px); line-height:1.15; color:var(--white); margin-bottom:20px; }
.portfolio-text .portfolio-desc { font-size:15px; color:rgba(245,247,250,0.65); line-height:1.75; margin-bottom:26px; }
.portfolio-text ul { list-style:none; padding:0; margin:0 0 32px; }
.portfolio-text ul li { font-size:14px; color:rgba(245,247,250,0.78); padding:8px 0 8px 28px; position:relative; }
.portfolio-text ul li::before { content:''; position:absolute; left:0; top:14px; width:14px; height:8px; border-left:2px solid var(--electric); border-bottom:2px solid var(--electric); transform:rotate(-45deg); }
.btn-visit { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#b6bfce,#4774ff); color:#fff; font-weight:700; font-size:14px; letter-spacing:1.2px; text-transform:uppercase; padding:14px 32px; border-radius:50px; text-decoration:none; box-shadow:0 4px 24px rgba(197,163,239,0.32); transition:opacity .2s,transform .2s; }
.btn-visit:hover { opacity:.88; transform:translateY(-2px); }
.btn-visit svg { width:14px; height:14px; }

.portfolio-mockup { position:relative; width:100%; aspect-ratio: 1.15 / 1; max-width:560px; margin:0 auto; }
.mockup-pc { position:absolute; top:6%; left:0; width:92%; background:#10121c; border:1px solid rgba(210,225,255,0.18); border-radius:14px; padding:22px 14px 14px; box-shadow:0 30px 80px rgba(0,0,0,0.55), 0 0 50px rgba(210,225,255,0.06); }
.mockup-pc::before { content:''; position:absolute; top:8px; left:14px; width:8px; height:8px; border-radius:50%; background:#ff5f56; box-shadow:14px 0 0 #ffbd2e, 28px 0 0 #27c93f; }
.mockup-pc-screen { width:100%; aspect-ratio: 16/10; border-radius:6px; overflow:hidden; background:#000; }
.mockup-pc-stand { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); width:34%; height:14px; background:linear-gradient(180deg,#141520,#080911); border-radius:0 0 12px 12px; border:1px solid rgba(210,225,255,0.12); border-top:none; }
.mockup-phone { position:absolute; bottom:-4%; right:-2%; width:30%; background:#10121c; border:1px solid rgba(210,225,255,0.22); border-radius:22px; padding:8px 6px; box-shadow:0 24px 60px rgba(0,0,0,0.65), 0 0 40px rgba(210,225,255,0.1); z-index:2; }
.mockup-phone::before { content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:36%; height:6px; background:#000; border-radius:4px; }
.mockup-phone-screen { width:100%; aspect-ratio: 9/19; border-radius:14px; overflow:hidden; background:#000; margin-top:14px; }
.mockup-pc-screen video, .mockup-phone-screen video, .mockup-pc-screen .fill, .mockup-phone-screen .fill { width:100%; height:100%; object-fit:cover; object-position:top; display:block; background:#000; }

@media (max-width:880px) {
  .portfolio-row { grid-template-columns:1fr; gap:48px; margin-bottom:96px; }
  .portfolio-row .portfolio-text { order:0 !important; }
  .portfolio-row .portfolio-mockup { order:1 !important; }
  .portfolio-mockup { max-width:420px; }
}


.faq-list { max-width:820px; margin:0 auto; }
.faq-item { border:1px solid rgba(210,225,255,0.12); background:rgba(255,255,255,0.025); border-radius:14px; margin-bottom:14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:border-color .25s, background .25s; overflow:hidden; }
.faq-item.open { border-color:rgba(210,225,255,0.35); background:rgba(210,225,255,0.04); }
.faq-question { display:flex; align-items:center; justify-content:space-between; padding:22px 26px; cursor:none; font-size:15px; font-weight:600; color:var(--white); letter-spacing:.3px; background:none; border:none; width:100%; text-align:left; font-family:inherit; }
.faq-question .faq-icon { width:24px; height:24px; flex-shrink:0; position:relative; transition:transform .3s; }
.faq-question .faq-icon::before,
.faq-question .faq-icon::after { content:''; position:absolute; top:50%; left:50%; background:var(--electric); border-radius:2px; transform:translate(-50%,-50%); }
.faq-question .faq-icon::before { width:14px; height:2px; }
.faq-question .faq-icon::after  { width:2px; height:14px; transition:opacity .3s; }
.faq-item.open .faq-question .faq-icon::after { opacity:0; }
.faq-answer { max-height:0; overflow:hidden; transition:max-height .35s ease; }
.faq-answer-inner { padding:0 26px 22px; color:rgba(245,247,250,0.65); font-size:14px; line-height:1.75; }
.faq-item.open .faq-answer { max-height:400px; }


.pricing-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:28px; align-items:stretch; }
.pricing-card-wrap { perspective:1200px; }
.pricing-card { position:relative; height:100%; min-height:420px; padding:32px 28px; border-radius:24px; border:1px solid rgba(210,225,255,0.14); background:linear-gradient(180deg, rgba(14,14,23,0.84) 0%, rgba(4,12,28,0.92) 100%); box-shadow:0 20px 60px rgba(0,0,0,0.35); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transform-style:preserve-3d; transition:transform .14s ease-out, box-shadow .2s ease, border-color .2s ease; will-change:transform; overflow:hidden; display:flex; flex-direction:column; }
.pricing-card::before { content:''; position:absolute; inset:-30% auto auto -20%; width:180px; height:180px; background:radial-gradient(circle, rgba(210,225,255,0.16), transparent 70%); pointer-events:none; }
.pricing-card:hover { border-color:rgba(210,225,255,0.32); box-shadow:0 26px 80px rgba(0,0,0,0.42), 0 0 32px rgba(210,225,255,0.08); }
.pricing-badge { display:inline-flex; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; border:1px solid rgba(210,225,255,0.18); background:rgba(255,255,255,0.04); color:var(--white); font-size:14px; font-weight:700; letter-spacing:.4px; margin-bottom:24px; align-self:flex-start; }
.pricing-price { font-family:'DM Serif Display',serif; font-size:clamp(34px, 4vw, 48px); line-height:1; color:var(--white); margin-bottom:20px; }
.pricing-price span { display:block; margin-top:8px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:rgba(245,247,250,0.58); }
.pricing-features { list-style:none; padding:0; margin:0 0 24px; }
.pricing-features li { position:relative; padding:0 0 0 26px; margin-bottom:14px; font-size:15px; line-height:1.65; color:rgba(245,247,250,0.78); }
.pricing-features li::before { content:''; position:absolute; left:0; top:9px; width:12px; height:7px; border-left:2px solid var(--electric); border-bottom:2px solid var(--electric); transform:rotate(-45deg); }
.pricing-note { margin-top:auto; font-size:14px; line-height:1.75; color:rgba(245,247,250,0.72); padding-top:18px; border-top:1px solid rgba(210,225,255,0.12); }
.pricing-disclaimer { max-width:880px; margin:36px auto 0; padding:26px 30px; border-radius:18px; border:1px solid rgba(210,225,255,0.12); background:rgba(255,255,255,0.03); color:rgba(245,247,250,0.72); font-size:15px; line-height:1.8; text-align:center; }
.pricing-disclaimer strong { color:var(--white); }
@media (max-width:980px) { .pricing-grid { grid-template-columns:1fr; } .pricing-card { min-height:auto; } }


#contact { background:#070911; z-index:20; }
#contact .section-inner { padding-bottom:80px; text-align:center; }
.contact-card { background:rgba(255,255,255,0.04); border:1px solid rgba(210,225,255,0.14); border-radius:24px; padding:54px 44px; max-width:760px; margin:0 auto; text-align:left; }
.contact-card .section-title { margin-bottom:14px; text-align:left; }
.contact-card .section-label { text-align:left; }
.contact-card .lead { color:rgba(245,247,250,0.65); font-size:15px; line-height:1.7; margin-bottom:36px; text-align:left; }
.btn-cta { display:inline-block; background:linear-gradient(135deg,#b6bfce,#4774ff); color:#fff; font-family:'Montserrat',sans-serif; font-weight:700; font-size:15px; letter-spacing:1px; padding:16px 44px; border-radius:50px; text-decoration:none; border:none; cursor:none; box-shadow:0 4px 30px rgba(197,163,239,0.35); transition:opacity .2s,transform .2s; }
.btn-cta:hover { opacity:.88; transform:translateY(-2px); }
.btn-cta:disabled { opacity:.55; cursor:not-allowed; transform:none; }

.contact-form { display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; }
.form-field { display:flex; flex-direction:column; }
.form-field.full { grid-column:1 / -1; }
.form-field label { font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:rgba(245,247,250,0.85); margin-bottom:8px; }
.form-field label .req { color:var(--electric); margin-left:4px; }
.form-field input,
.form-field textarea,
.form-field select {
  background:rgba(3,4,10,0.55);
  border:1px solid rgba(210,225,255,0.18);
  border-radius:10px;
  padding:13px 14px;
  color:var(--white);
  font-family:'Montserrat',sans-serif;
  font-size:14px;
  transition:border-color .2s, box-shadow .2s, background .2s;
  outline:none;
  width:100%;
}
.form-field textarea { resize:vertical; min-height:130px; line-height:1.55; }
.form-field input::placeholder,
.form-field textarea::placeholder { color:rgba(245,247,250,0.32); }
.form-field input:focus,
.form-field textarea:focus,
.form-field select:focus { border-color:var(--electric); box-shadow:0 0 0 3px rgba(210,225,255,0.12); background:rgba(3,4,10,0.75); }
.phone-row { display:grid; grid-template-columns:120px 1fr; gap:8px; }
.phone-row select { padding-right:6px; }
.form-actions { grid-column:1 / -1; display:flex; align-items:center; justify-content:flex-start; gap:18px; margin-top:8px; flex-wrap:wrap; }
.form-status { font-size:13px; color:rgba(245,247,250,0.7); }
.form-status.ok  { color:var(--electric); }
.form-status.err { color:#ff6b6b; }

@media (max-width:680px) {
  .contact-card { padding:38px 22px; }
  .contact-form { grid-template-columns:1fr; }
  .phone-row    { grid-template-columns:110px 1fr; }
  #navbar { padding:16px 16px; }
  .nav-pill { height:44px; padding:0 16px; }
  .lang-trigger { height:44px; padding:0 16px; }
}

footer { position:relative; z-index:20; background:#03040a; text-align:center; padding:24px; font-size:12px; color:rgba(245,247,250,0.25); letter-spacing:1px; border-top:1px solid rgba(210,225,255,0.06); }


@media (hover: none) {
  body { cursor: auto; }
  #cursor { display:none; }
  .lang-trigger, .lang-menu button, .btn-cta, .faq-question { cursor: pointer; }
}

<header id="navbar">
  <nav aria-label="Navigation principale">
    <a href="index.html" class="nav-pill logo"><img class="logo-img" src="digital-concepts-logo.webp" alt="Digital Concepts"></a>
    <div class="nav-line" aria-hidden="true"></div>
    <div class="lang-switcher" id="langSwitcher">
      <button type="button" class="lang-trigger" id="langTrigger" aria-haspopup="listbox" aria-expanded="false">
        <span id="langCurrent">FR</span>
        <span class="caret">▾</span>
      </button>
      <ul class="lang-menu" role="listbox" id="langMenu"></ul>
    </div>
  </nav>
</header>
<script>
/* ═══ HEADER SCROLL BEHAVIOR — hide on scroll down, show on scroll up (identique à index.html) ═══ */
(function () {
  const header = document.getElementById('navbar');
  if (!header) return;
  const REVEAL_THRESHOLD = 80; // toujours visible tant qu'on est proche du haut
  let lastY = window.scrollY;
  let ticking = false;

  function update() {
    const y = window.scrollY;
    if (y <= REVEAL_THRESHOLD) {
      header.classList.remove('nav-hidden');
    } else if (y > lastY) {
      header.classList.add('nav-hidden');
    } else if (y < lastY) {
      header.classList.remove('nav-hidden');
    }
    lastY = y;
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });
})();
</script>

// ---- Contact form: phone dial-code auto-detection via IP geolocation ----
// Detects the visitor's country from their IP address and preselects the
// matching dial code. Falls back to +41 (Switzerland) if detection fails.
// The visitor can always change the selection manually afterwards.
let __detectedDialCode = null; // cached so we don't re-fetch on every re-render (lang switch, etc.)

function applyDialCode(select, code, iso){
  if (!select) return;
  if (iso){
    const opt = Array.from(select.options).find(o => o.dataset.iso === iso);
    if (opt){ select.value = opt.value; return; }
  }
  const opt2 = Array.from(select.options).find(o => o.value === code);
  select.value = opt2 ? opt2.value : (code || '+41');
}

function detectAndSetDialCode(){
  const select = document.getElementById('dialCode');
  if (!select) return;

  if (__detectedDialCode){
    applyDialCode(select, __detectedDialCode.code, __detectedDialCode.iso);
    return;
  }

  // Sensible immediate default while detection is in progress
  applyDialCode(select, '+41', 'CH');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);

  fetch('https://ipapi.co/json/', { signal: controller.signal })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      clearTimeout(timeout);
      const iso = data && data.country_code ? String(data.country_code).toUpperCase() : null;
      const code = data && data.country_calling_code ? data.country_calling_code : null;
      __detectedDialCode = (iso || code) ? { code: code || '+41', iso: iso } : { code: '+41', iso: 'CH' };
      const sel = document.getElementById('dialCode');
      applyDialCode(sel, __detectedDialCode.code, __detectedDialCode.iso);
    })
    .catch(() => {
      clearTimeout(timeout);
      __detectedDialCode = { code: '+41', iso: 'CH' };
      const sel = document.getElementById('dialCode');
      applyDialCode(sel, '+41', 'CH');
    });
}

const LANGS = [{"code":"ar","label":"العربية","flag":""},
  { code: 'fr', label: 'Français', flag: '🇫🇷' },
  { code: 'en', label: 'English',  flag: '🇬🇧' },
  { code: 'de', label: 'Deutsch',  flag: '🇩🇪' },
  { code: 'es', label: 'Español',  flag: '🇪🇸' },
  { code: 'it', label: 'Italiano', flag: '🇮🇹' },
];
const AVAILABLE = LANGS.map(l => l.code);

function detectLang() {
  if (typeof window!=='undefined' && window.__lang && AVAILABLE.includes(window.__lang)) return window.__lang;
  const saved = localStorage.getItem('lang');
  if (saved && AVAILABLE.includes(saved)) return saved;
  const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  return AVAILABLE.includes(nav) ? nav : 'en';
}

let currentLang = detectLang();

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function mockupHtml(i){
  const m = PORTFOLIO_MEDIA[i];
  const startAt = m.startAt ?? 0;
  const vid = (src, poster) => `<video class="mk-video" muted loop playsinline preload="none" data-start="${startAt}" data-src="${src}" data-poster="${poster||''}"></video>`;
  const scr = (src) => `<div class="scroll-frame"><img class="scroll-img" src="${src}" alt="" loading="lazy"/></div>`;
  const desktopInner = m.desktopMp4 ? vid(m.desktopMp4, m.desktopPoster) : (m.scrollDesktop ? scr(m.scrollDesktop) : `<div class="fill" style="background:${m.placeholderTint||'#10121c'}"></div>`);
  const phoneInner   = m.mobileMp4  ? vid(m.mobileMp4, m.mobilePoster)  : (m.scrollMobile  ? scr(m.scrollMobile)  : `<div class="fill" style="background:${m.placeholderTint||'#10121c'}"></div>`);
  return `<div class="portfolio-mockup" data-portfolio-mockup>
    <div class="mockup-pc"><div class="mockup-pc-screen">${desktopInner}</div><div class="mockup-pc-stand"></div></div>
    <div class="mockup-phone"><div class="mockup-phone-screen">${phoneInner}</div></div>
  </div>`;
}

  // Nav labels

    const key = el.getAttribute('data-i18n').split('.');

    if (v) el.textContent = v;
  });

  const portfolioRows = t.portfolio.items.map((item,i)=>{

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>
    </div>`;
    const mk = mockupHtml(i);
    return `<div class="portfolio-row${reverse?' reverse':''}">${reverse?mk+text:text+mk}</div>`;
  }).join('');

  const faqItems = t.faq.items.map((it,i)=>`
    <div class="faq-item" data-idx="${i}">
      <button type="button" class="faq-question" aria-expanded="false">
        <span>${escapeHtml(it.q)}</span>
        <span class="faq-icon" aria-hidden="true"></span>

  const pricingCards = t.pricing.plans.map(p=>`
    <div class="pricing-card-wrap">

        <ul class="pricing-features">${p.features.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul>
        <p class="pricing-note">${escapeHtml(p.note)}</p>
      </article>
    </div>`).join('');

  const dialOpts = DIAL_CODES.map(d=>`<option value="${d.code}" data-iso="${d.iso}">${d.flag} ${d.code}</option>`).join('');

  document.getElementById('app').innerHTML = `

      <div style="text-align:center;margin-bottom:56px">

            <textarea id="message" name="Message" required placeholder="${escapeHtml(t.contact.messagePh)}"></textarea></div>
          <div class="form-actions">
            <button type="submit" class="btn-cta" id="submitBtn">${escapeHtml(t.contact.submit)}</button>
            <span class="form-status" id="formStatus" role="status" aria-live="polite"></span>

    <footer><a data-i18n="footer" href="droit.html" style="color:inherit;text-decoration:underline;cursor:pointer;">© Digital Concepts 2026 — Tous droits réservés</a></footer>
  `;

  // Default dial code — auto-detected from visitor's IP, +41 (Switzerland) as fallback
  detectAndSetDialCode();

  // FAQ interactions
  document.querySelectorAll('.faq-item').forEach(item=>{
    const btn = item.querySelector('.faq-question');
    btn.addEventListener('click',()=>{
      const open = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', open?'true':'false');
    });
  });

  // Pricing tilt
  document.querySelectorAll('.pricing-card-wrap').forEach(wrap=>{
    const card = wrap.querySelector('.pricing-card');
    wrap.addEventListener('mousemove',e=>{
      const r = wrap.getBoundingClientRect();
      const px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
      card.style.transform = `rotateX(${(0.5-py)*10}deg) rotateY(${(px-0.5)*10}deg) translateY(-6px)`;
    });
    wrap.addEventListener('mouseleave',()=>{ card.style.transform='rotateX(0) rotateY(0) translateY(0)'; });
  });

  // Contact form — classic HTML POST submission to FormSubmit (no AJAX, no preventDefault).
  // We only pre-fill a couple of hidden helper fields right before the browser
  // performs its normal navigation/submission.
  const form = document.getElementById('contactForm');
  form.addEventListener('submit', () => {
    const dialEl = document.getElementById('dialCode');
    const phoneEl = document.getElementById('phone');
    const dial = dialEl ? dialEl.value : '';
    const phone = phoneEl ? phoneEl.value.trim() : '';

    if (phoneFull) phoneFull.value = phone ? (dial + ' ' + phone) : '';
    const nextEl = document.getElementById('formNext');
    if (nextEl) nextEl.value = window.location.href;
    // No e.preventDefault(): the browser submits the form normally to FormSubmit.
  });
}

function renderLangMenu(){

  menu.innerHTML = LANGS.map(l=>`
    <li><button type="button" data-lang="${l.code}" class="${l.code===currentLang?'active':''}">
      <span>${l.flag} ${l.label}</span><span class="check">✓</span>

  document.getElementById('langCurrent').textContent = currentLang.toUpperCase();
  menu.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      currentLang = b.getAttribute('data-lang');
      localStorage.setItem('lang', currentLang);
      document.getElementById('langSwitcher').classList.remove('open');
      document.getElementById('langTrigger').setAttribute('aria-expanded','false');
      renderLangMenu(); renderApp();
    });
  });
}

document.getElementById('langTrigger').addEventListener('click',()=>{

});
document.addEventListener('click',e=>{
  const sw = document.getElementById('langSwitcher');
  if (!sw.contains(e.target)){ sw.classList.remove('open'); document.getElementById('langTrigger').setAttribute('aria-expanded','false'); }
});

renderLangMenu();
renderApp();

</nav>
<script>
(function(){
  var IDS=['hero','portfolio','faq','pricing','contact'];
  var nav=document.getElementById('wsSpy'); if(!nav) return;
  var btns={};
  nav.querySelectorAll('button[data-target]').forEach(function(b){btns[b.dataset.target]=b;});
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // --- i18n pour le scrollspy (aligné sur les langues du site) ---
  var SPY_I18N={ar:{"nav":"التنقّل بين الأقسام","go":"انتقل إلى ","labels":{"hero":"الرئيسية","services":"خدماتنا","pourquoi":"لماذا نحن؟","equipe":"فريقنا","contact":"تواصل معنا","portfolio":"أعمالنا","faq":"الأسئلة الشائعة","pricing":"الأسعار"}},
    fr:{nav:"Navigation des sections",go:"Aller à ",labels:{hero:"Accueil",portfolio:"Portfolio",faq:"FAQ",pricing:"Tarifs",contact:"Contact"}},
    en:{nav:"Section navigation",go:"Go to ",labels:{hero:"Home",portfolio:"Portfolio",faq:"FAQ",pricing:"Pricing",contact:"Contact"}},
    de:{nav:"Abschnittsnavigation",go:"Gehe zu ",labels:{hero:"Start",portfolio:"Portfolio",faq:"FAQ",pricing:"Preise",contact:"Kontakt"}},
    es:{nav:"Navegación de secciones",go:"Ir a ",labels:{hero:"Inicio",portfolio:"Portfolio",faq:"FAQ",pricing:"Precios",contact:"Contacto"}},
    it:{nav:"Navigazione delle sezioni",go:"Vai a ",labels:{hero:"Home",portfolio:"Portfolio",faq:"FAQ",pricing:"Prezzi",contact:"Contatti"}}
  };
  function applySpyLabels(lang){
    var dict=SPY_I18N[lang]||SPY_I18N.fr;
    nav.setAttribute('aria-label',dict.nav);
    IDS.forEach(function(id){
      var b=btns[id]; if(!b) return;
      var lbl=b.querySelector('.lbl');
      var text=dict.labels[id];
      if(lbl && text) lbl.textContent=text;
      if(text) b.setAttribute('aria-label',dict.go+text);
    });
  }
  window.wsSpyUpdateLabels=applySpyLabels;
  // Applique la langue déjà active au chargement (currentLang vient du script principal)
  applySpyLabels(typeof currentLang!=='undefined'?currentLang:'fr');
  function setActive(id){IDS.forEach(function(k){if(btns[k]) btns[k].classList.toggle('is-active',k===id);});}
  nav.querySelectorAll('button[data-target]').forEach(function(b){
    b.addEventListener('click',function(){
      var el=document.getElementById(b.dataset.target); if(!el) return;
      el.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
      setActive(b.dataset.target);
    });
  });
  function mount(){
    var visibility=new Map(); var current=null;
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){visibility.set(e.target.id,e.isIntersecting?e.intersectionRatio:0);});
      var bestId=current,best=-1;
      visibility.forEach(function(r,id){if(r>best){best=r;bestId=id;}});
      if(best>0&&bestId!==current){current=bestId;setActive(bestId);}
    },{rootMargin:'-35% 0px -55% 0px',threshold:[0,.25,.5,.75,1]});
    var found=0;
    IDS.forEach(function(id){var el=document.getElementById(id); if(el){io.observe(el);found++;}});
    if(found>0) requestAnimationFrame(function(){nav.classList.add('is-ready');});
  }
  var app=document.getElementById('app');
  if(app && IDS.every(function(id){return !document.getElementById(id);})){
    var mo=new MutationObserver(function(){
      if(IDS.some(function(id){return document.getElementById(id);})){mo.disconnect();mount();}
    });
    mo.observe(app,{childList:true,subtree:true});
    setTimeout(function(){try{mo.disconnect();}catch(e){} mount();},4000);
  } else { mount(); }
})();
</script>


<script>
/* === Lovable unified IP dial-code detection (identical logic on all pages) === */
(function(){
  function selectByCountry(cc){
    var dial = document.getElementById('dialCode');
    if (!dial || !cc) return false;
    cc = String(cc).toUpperCase();
    var opt = dial.querySelector('option[data-country="'+cc+'"]')
           || dial.querySelector('option[data-iso="'+cc+'"]');
    if (opt){ dial.value = opt.value; try{ dial.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} return true; }
    return false;
  }
  function selectByDial(code){
    var dial = document.getElementById('dialCode');
    if (!dial || !code) return false;
    code = String(code); if (code.charAt(0)!=='+') code = '+' + code.replace(/^\+/,'');
    for (var i=0;i<dial.options.length;i++){
      if (dial.options[i].value === code){ dial.value = code; try{ dial.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} return true; }
    }
    return false;
  }
  function applyFallback(){
    var dial = document.getElementById('dialCode');
    if (dial && !dial.value) dial.value = '+41';
  }
  function tryProvider(url, extract){
    return fetch(url).then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('http')); }).then(function(data){
      var info = extract(data);
      if (!info) throw new Error('no-data');
      if (selectByCountry(info.country)) return true;
      if (selectByDial(info.dial)) return true;
      throw new Error('no-match');
    });
  }
  function detect(){
    var dial = document.getElementById('dialCode');
    if (!dial) return;
    applyFallback();
    tryProvider('https://ipapi.co/json/', function(d){
      return { country: d && (d.country_code || d.country), dial: d && d.country_calling_code };
    }).catch(function(){
      return tryProvider('https://ipwho.is/', function(d){
        if (!d || d.success === false) return null;
        return { country: d.country_code, dial: d.calling_code };
      });
    }).catch(function(){
      return tryProvider('https://get.geojs.io/v1/ip/country.json', function(d){
        return { country: d && (d.country || d.country_code), dial: null };
      });
    }).catch(function(){ applyFallback(); });
  }
  function init(){
    if (document.getElementById('dialCode')) { detect(); return; }
    var mo = new MutationObserver(function(){
      if (document.getElementById('dialCode')){ mo.disconnect(); detect(); }
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function(){ try{ mo.disconnect(); }catch(e){} if (document.getElementById('dialCode')) detect(); }, 20000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
